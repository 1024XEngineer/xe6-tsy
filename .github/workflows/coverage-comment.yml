name: Coverage Comment

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve baseline run
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            let pullRequest =
              (run.pull_requests && run.pull_requests[0]) || null;
            if (!pullRequest || !pullRequest.base || !pullRequest.base.ref) {
              const headOwner = run.head_repository?.owner?.login;
              if (headOwner && run.head_branch) {
                const candidates = await github.paginate(
                  github.rest.pulls.list,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: "open",
                    head: headOwner + ":" + run.head_branch,
                    per_page: 100,
                  },
                );
                pullRequest = candidates.find(
                  (candidate) => candidate.head.sha === run.head_sha,
                ) || null;
              }
            }
            if (!pullRequest || !pullRequest.base || !pullRequest.base.ref) {
              core.warning(
                "Unable to determine the pull request base branch; coverage comment skipped",
              );
              core.setOutput("available", "false");
              return;
            }

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );
            const testWorkflow = workflows.find(
              (workflow) => workflow.name === "Test",
            );
            if (!testWorkflow) {
              core.warning("Unable to find the Test workflow; coverage comment skipped");
              core.setOutput("available", "false");
              return;
            }

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: testWorkflow.id,
                branch: pullRequest.base.ref,
                event: "push",
                status: "completed",
                per_page: 100,
              },
            );
            const expectedArtifacts = [
              "go-coverage-contracts",
              "go-coverage-api",
              "go-coverage-realtime-audio",
            ];
            let baseline = null;
            for (const run of runs.filter((candidate) => candidate.conclusion === "success")) {
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id,
                  per_page: 100,
                },
              );
              const hasCoverageArtifacts = expectedArtifacts.every((name) =>
                artifacts.some((artifact) => artifact.name === name),
              );
              if (hasCoverageArtifacts) {
                baseline = run;
                break;
              }
            }
            if (!baseline) {
              core.warning(
                "No successful Test run has a complete coverage artifact baseline; coverage comment skipped",
              );
              core.setOutput("available", "false");
              return;
            }

            core.setOutput("run_id", String(baseline.id));
            core.setOutput("branch", pullRequest.base.ref);
            core.setOutput("pull_request_number", String(pullRequest.number));
            core.setOutput("available", "true");

      - name: Download current coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/current
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download baseline coverage reports
        if: steps.baseline.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.baseline.outputs.run_id }}

      - name: Create or update PR coverage comment
        if: steps.baseline.outputs.available == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const modules = [
              { artifact: "go-coverage-contracts", label: "packages/contracts" },
              { artifact: "go-coverage-api", label: "services/api" },
              { artifact: "go-coverage-realtime-audio", label: "services/realtime-audio" },
            ];
            const marker = "<!-- go-native-coverage -->";
            const maxFiles = 5;

            function parseCoverageProfile(content, moduleLabel) {
              const files = new Map();
              let totalStatements = 0;
              let coveredStatements = 0;

              for (const line of content.split(/\r?\n/)) {
                if (!line || line.startsWith("mode:")) {
                  continue;
                }

                const match = line.match(/^(.*):\d+\.\d+,\d+\.\d+\s+(\d+)\s+(\d+)$/);
                if (!match) {
                  continue;
                }

                const file = moduleLabel + "/" + match[1];
                const statements = Number(match[2]);
                const hits = Number(match[3]);
                const covered = hits > 0 ? statements : 0;

                totalStatements += statements;
                coveredStatements += covered;

                const current = files.get(file) ?? { totalStatements: 0, coveredStatements: 0 };
                current.totalStatements += statements;
                current.coveredStatements += covered;
                files.set(file, current);
              }

              return { files, totalStatements, coveredStatements };
            }

            function readCoverageTree(rootDir) {
              const files = new Map();
              const moduleStats = new Map();
              let totalStatements = 0;
              let coveredStatements = 0;

              for (const module of modules) {
                const profilePath = path.join(rootDir, module.artifact, "coverage.out");
                const content = fs.readFileSync(profilePath, "utf8");
                const parsed = parseCoverageProfile(content, module.label);
                moduleStats.set(module.label, parsed);

                totalStatements += parsed.totalStatements;
                coveredStatements += parsed.coveredStatements;

                for (const [file, stats] of parsed.files) {
                  const current = files.get(file) ?? { totalStatements: 0, coveredStatements: 0 };
                  current.totalStatements += stats.totalStatements;
                  current.coveredStatements += stats.coveredStatements;
                  files.set(file, current);
                }
              }

              return {
                files,
                moduleStats,
                totalStatements,
                coveredStatements,
              };
            }

            function percent(stats) {
              if (stats.totalStatements === 0) {
                return 0;
              }
              return (stats.coveredStatements / stats.totalStatements) * 100;
            }

            function formatPercent(value) {
              return value.toFixed(1) + "%";
            }

            function formatDelta(value) {
              return (value >= 0 ? "+" : "") + value.toFixed(1) + "%";
            }

            const current = readCoverageTree(path.join("coverage", "current"));
            const baseline = readCoverageTree(path.join("coverage", "baseline"));
            const currentTotal = percent(current);
            const baselineTotal = percent(baseline);
            const totalDelta = currentTotal - baselineTotal;
            const rows = [];

            for (const module of modules) {
              const currentModule = percent(current.moduleStats.get(module.label));
              const baselineModule = percent(baseline.moduleStats.get(module.label));
              rows.push(
                "| " +
                  module.label +
                  " | " +
                  formatPercent(currentModule) +
                  " | " +
                  formatPercent(baselineModule) +
                  " | " +
                  formatDelta(currentModule - baselineModule) +
                  " |",
              );
            }
            rows.push(
              "| **Total** | **" +
                formatPercent(currentTotal) +
                "** | **" +
                formatPercent(baselineTotal) +
                "** | **" +
                formatDelta(totalDelta) +
                "** |",
            );

            const lowFiles = [];
            for (const [file, currentFile] of current.files) {
              const baselineFile = baseline.files.get(file);
              if (!baselineFile) {
                continue;
              }

              const currentFilePercent = percent(currentFile);
              const baselineFilePercent = percent(baselineFile);
              const delta = currentFilePercent - baselineFilePercent;
              if (delta < -1e-9) {
                lowFiles.push({
                  file,
                  current: currentFilePercent,
                  baseline: baselineFilePercent,
                  delta,
                });
              }
            }
            lowFiles.sort(
              (left, right) =>
                left.delta - right.delta || left.file.localeCompare(right.file),
            );

            const run = context.payload.workflow_run;
            const pullRequestNumber = Number(process.env.PULL_REQUEST_NUMBER);

            const bodyLines = [
              marker,
              "## Go coverage",
              "",
              "| Scope | Current | Baseline | Delta |",
              "| --- | ---: | ---: | ---: |",
              ...rows,
            ];

            if (totalDelta < -1e-9) {
              bodyLines.push(
                "",
                "### Files below baseline",
                "",
                "Showing the " + maxFiles + " largest file-level regressions.",
                "",
                "| File | Current | Baseline | Delta |",
                "| --- | ---: | ---: | ---: |",
              );
              if (lowFiles.length === 0) {
                bodyLines.push(
                  "| No overlapping files below baseline | - | - | - |",
                );
              } else {
                for (const file of lowFiles.slice(0, maxFiles)) {
                  bodyLines.push(
                    "| " +
                      file.file +
                      " | " +
                      formatPercent(file.current) +
                      " | " +
                      formatPercent(file.baseline) +
                      " | " +
                      formatDelta(file.delta) +
                      " |",
                  );
                }
              }
            }

            bodyLines.push(
              "",
              "Base branch: " +
                process.env.BASE_BRANCH +
                " · Commit: " +
                run.head_sha.slice(0, 7) +
                " · [Test workflow run](" +
                run.html_url +
                ")",
            );
            const body = bodyLines.join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequestNumber,
                per_page: 100,
              },
            );
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequestNumber,
              body,
            });
        env:
          BASE_BRANCH: ${{ steps.baseline.outputs.branch }}
          PULL_REQUEST_NUMBER: ${{ steps.baseline.outputs.pull_request_number }}
  publish-coverage-badge:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/current
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Generate coverage endpoint data
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = require("path");

            const artifacts = [
              "go-coverage-contracts",
              "go-coverage-api",
              "go-coverage-realtime-audio",
            ];

            let totalStatements = 0;
            let coveredStatements = 0;

            for (const artifact of artifacts) {
              const profilePath = path.join(
                "coverage",
                "current",
                artifact,
                "coverage.out",
              );
              const content = fs.readFileSync(profilePath, "utf8");

              for (const line of content.split(/\r?\n/)) {
                if (!line || line.startsWith("mode:")) continue;

                const match = line.match(
                  /^(.*):\d+\.\d+,\d+\.\d+\s+(\d+)\s+(\d+)$/,
                );
                if (!match) continue;

                const statements = Number(match[2]);
                const hits = Number(match[3]);
                totalStatements += statements;
                coveredStatements += hits > 0 ? statements : 0;
              }
            }

            const coverage = totalStatements === 0
              ? 0
              : (coveredStatements / totalStatements) * 100;
            const color = coverage >= 80 ? "brightgreen"
              : coverage >= 60 ? "yellow"
              : "red";

            fs.mkdirSync("public", { recursive: true });
            fs.writeFileSync(
              "public/coverage.json",
              JSON.stringify({
                schemaVersion: 1,
                label: "coverage",
                message: coverage.toFixed(1) + "%",
                color,
                cacheSeconds: 300,
              }),
            );

      - name: Upload coverage endpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-endpoint
          path: public/coverage.json
          if-no-files-found: error
          retention-days: 14
