name: Deploy Web To GitHub Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_STATIC_EXPORT: "1"
      NEXT_PUBLIC_BASE_PATH: /xe6-tsy
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.7

      - name: Download Go modules
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          for module in packages/contracts services/api services/realtime-audio; do
            go -C "$module" mod download
          done

      - name: Install ONNX Runtime for coverage
        shell: bash
        working-directory: services/realtime-audio
        run: |
          set -euo pipefail
          lib="third_party/onnxruntime/lib/libonnxruntime.so"
          if [[ -f "$lib" ]]; then
            exit 0
          fi
          version=1.24.1
          mkdir -p third_party/onnxruntime
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v${version}/onnxruntime-linux-x64-${version}.tgz" -o /tmp/ort.tgz
          mkdir -p /tmp/ort-extract
          tar -xzf /tmp/ort.tgz -C /tmp/ort-extract
          inner="$(find /tmp/ort-extract -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          cp -a "$inner"/. third_party/onnxruntime/
          versioned="$(find third_party/onnxruntime/lib -maxdepth 1 -type f -name 'libonnxruntime.so.*' | head -n 1)"
          ln -sfn "$(basename "$versioned")" "$lib"

      - name: Generate coverage endpoint data
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          coverage_root="$GITHUB_WORKSPACE/coverage/current"
          mkdir -p "$coverage_root/go-coverage-contracts" "$coverage_root/go-coverage-api" "$coverage_root/go-coverage-realtime-audio"
          go -C packages/contracts test -count=1 -covermode=atomic -coverprofile="$coverage_root/go-coverage-contracts/coverage.out" ./...
          go -C services/api test -count=1 -covermode=atomic -coverprofile="$coverage_root/go-coverage-api/coverage.out" ./...
          LD_LIBRARY_PATH="$GITHUB_WORKSPACE/services/realtime-audio/third_party/onnxruntime/lib" go -C services/realtime-audio test -count=1 -covermode=atomic -coverprofile="$coverage_root/go-coverage-realtime-audio/coverage.out" ./...
          node apps/web/scripts/generate-coverage-badge.mjs "$coverage_root" apps/web/public/coverage.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download coverage reports
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          pattern: go-coverage-*
          path: coverage/current
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Generate coverage endpoint data
        if: github.event_name == 'workflow_run'
        run: node ./scripts/generate-coverage-badge.mjs coverage/current ./public/coverage.json

      - name: Build static site
        run: npm run build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: intro-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
