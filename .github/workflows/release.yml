name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - packages/contracts
          - services/api
          - services/realtime-audio
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go build ./...
      - run: go test -count=1 -race ./...

  verify-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lingow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lingow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    env:
      RECORDSTORE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lingow_test?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lingow_test?sslmode=disable
      JWT_SECRET: ci-integration-secret-1234567890123456
      REALTIME_TICKET_SECRET: ci-realtime-ticket-secret-1234567890
      LINGOW_SESSION_RUNTIME: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
      - run: go mod download
      - run: go test -count=1 -tags=integration ./...

  create-release:
    needs: [verify-go, verify-integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build release artifacts
        run: |
          mkdir -p dist
          (cd services/api && go build -trimpath -o ../../dist/lingow-api .)
          (cd services/realtime-audio && go build -trimpath -o ../../dist/lingow-realtime-audio .)
          sha256sum dist/* > dist/checksums.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --generate-notes
