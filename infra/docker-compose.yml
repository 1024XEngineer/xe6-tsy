services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lingow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  realtime-gateway:
    image: nginx:1.27-alpine
    profiles: ["realtime-multi"]
    ports:
      - "8090:8090"
    volumes:
      - ./realtime-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgres_data:
