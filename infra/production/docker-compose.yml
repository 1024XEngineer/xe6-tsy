name: lingow

services:
  api:
    image: ${LINGOW_API_IMAGE:?LINGOW_API_IMAGE is required}
    restart: unless-stopped
    environment:
      APP_ENV: production
      API_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-lingow-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lingow-client}
      AUTH_PEPPER: ${AUTH_PEPPER:?AUTH_PEPPER is required}
      VERIFICATION_SENDER: ${VERIFICATION_SENDER:-}
      LINGOW_SESSION_RUNTIME: enabled
      REALTIME_BASE_URL: http://realtime-audio:8090
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      REALTIME_HTTP_TIMEOUT: ${REALTIME_HTTP_TIMEOUT:-5s}
      LINGOW_DELIVERY_RUNTIME: enabled
      LINGOW_DELIVERY_DESTINATION_KEY: ${LINGOW_DELIVERY_DESTINATION_KEY:?LINGOW_DELIVERY_DESTINATION_KEY is required}
      LINGOW_DELIVERY_PROVIDER: ${LINGOW_DELIVERY_PROVIDER:-smtp}
      LINGOW_DELIVERY_CONSUMER: ${LINGOW_DELIVERY_CONSUMER:?LINGOW_DELIVERY_CONSUMER is required}
      LINGOW_DELIVERY_STREAM: ${LINGOW_DELIVERY_STREAM:-lingow:delivery}
      LINGOW_DELIVERY_GROUP: ${LINGOW_DELIVERY_GROUP:-lingow-delivery}
      LINGOW_DELIVERY_DELAY_STREAM: ${LINGOW_DELIVERY_DELAY_STREAM:-lingow:delivery:delayed}
      LINGOW_DELIVERY_DELAY_KEY: ${LINGOW_DELIVERY_DELAY_KEY:-lingow:delivery:delay}
      LINGOW_USAGE_STREAM: ${LINGOW_USAGE_STREAM:-lingow:usage:recorded}
      LINGOW_USAGE_GROUP: ${LINGOW_USAGE_GROUP:-lingow-usage}
      LINGOW_USAGE_CONSUMER: ${LINGOW_USAGE_CONSUMER:?LINGOW_USAGE_CONSUMER is required}
      LINGOW_MODE_CHANGED_STREAM: ${LINGOW_MODE_CHANGED_STREAM:-lingow:realtime:mode:changed}
      LINGOW_MODE_CHANGED_GROUP: ${LINGOW_MODE_CHANGED_GROUP:-lingow-mode-projection}
      LINGOW_MODE_CHANGED_CONSUMER: ${LINGOW_MODE_CHANGED_CONSUMER:?LINGOW_MODE_CHANGED_CONSUMER is required}
      LINGOW_RECORDS_SYSTEM_TOKEN: ${LINGOW_RECORDS_SYSTEM_TOKEN:?LINGOW_RECORDS_SYSTEM_TOKEN is required}
      LINGOW_COMMAND_SYSTEM_TOKEN: ${LINGOW_COMMAND_SYSTEM_TOKEN:?LINGOW_COMMAND_SYSTEM_TOKEN is required}
      LINGOW_SMTP_HOST: ${LINGOW_SMTP_HOST:-}
      LINGOW_SMTP_PORT: ${LINGOW_SMTP_PORT:-587}
      LINGOW_SMTP_USER: ${LINGOW_SMTP_USER:-}
      LINGOW_SMTP_PASSWORD: ${LINGOW_SMTP_PASSWORD:-}
      LINGOW_SMTP_FROM: ${LINGOW_SMTP_FROM:-}
      LINGOW_SMTP_TLS: ${LINGOW_SMTP_TLS:-true}
      LINGOW_WECOM_CORP_ID: ${LINGOW_WECOM_CORP_ID:-}
      LINGOW_WECOM_CORP_SECRET: ${LINGOW_WECOM_CORP_SECRET:-}
      LINGOW_WECOM_AGENT_ID: ${LINGOW_WECOM_AGENT_ID:-}
    depends_on:
      realtime-audio:
        condition: service_healthy

  realtime-audio:
    image: ${LINGOW_REALTIME_AUDIO_IMAGE:?LINGOW_REALTIME_AUDIO_IMAGE is required}
    restart: unless-stopped
    environment:
      REALTIME_ADDR: :8090
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET:?REALTIME_TICKET_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      REALTIME_API_DATABASE: enabled
      REALTIME_OUTBOX: valkey
      REALTIME_LONG_SENTENCE_DELIVERY: ${REALTIME_LONG_SENTENCE_DELIVERY:-enabled}
      REALTIME_TTS_DOWNLINK: ${REALTIME_TTS_DOWNLINK:-pcm}
      LINGOW_API_BASE_URL: http://api:8080
      LINGOW_COMMAND_SYSTEM_TOKEN: ${LINGOW_COMMAND_SYSTEM_TOKEN:?LINGOW_COMMAND_SYSTEM_TOKEN is required}
      COMMAND_CONFIG_TIMEOUT_MS: ${COMMAND_CONFIG_TIMEOUT_MS:-3000}
      ASR_PROVIDER: ${ASR_PROVIDER:?ASR_PROVIDER is required}
      ASR_BASE_URL: ${ASR_BASE_URL:-}
      ASR_WEBSOCKET_URL: ${ASR_WEBSOCKET_URL:-}
      ASR_MODEL: ${ASR_MODEL:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      ASR_SAMPLE_RATE: ${ASR_SAMPLE_RATE:-16000}
      ASR_VAD_THRESHOLD: ${ASR_VAD_THRESHOLD:-0.0}
      ASR_SILENCE_DURATION_MS: ${ASR_SILENCE_DURATION_MS:-500}
      LLM_PROVIDER: ${LLM_PROVIDER:?LLM_PROVIDER is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_ENABLE_THINKING: ${LLM_ENABLE_THINKING:-false}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-15000}
      TTS_PROVIDER: ${TTS_PROVIDER:?TTS_PROVIDER is required}
      TTS_BASE_URL: ${TTS_BASE_URL:-}
      TTS_MODEL: ${TTS_MODEL:-}
      TTS_API_KEY: ${TTS_API_KEY:-}
      TTS_VOICE: ${TTS_VOICE:-}
      TTS_SAMPLE_RATE: ${TTS_SAMPLE_RATE:-24000}
      TTS_TIMEOUT_MS: ${TTS_TIMEOUT_MS:-30000}
      COMMAND_INTERPRETER: ${COMMAND_INTERPRETER:-legacy}
      COMMAND_LLM_API_KEY: ${COMMAND_LLM_API_KEY:-}
      COMMAND_LLM_BASE_URL: ${COMMAND_LLM_BASE_URL:-}
      COMMAND_LLM_MODEL: ${COMMAND_LLM_MODEL:-}
      COMMAND_LLM_TIMEOUT_MS: ${COMMAND_LLM_TIMEOUT_MS:-10000}
      LOCAL_VAD_PROVIDER: silero

  web:
    image: ${LINGOW_WEB_IMAGE:?LINGOW_WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      realtime-audio:
        condition: service_healthy
