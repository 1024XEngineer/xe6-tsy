events {}

http {
    map $http_x_lingow_route_debug $lingow_route_debug {
        default "";
        "1"     $upstream_addr;
    }

    upstream realtime_audio {
        hash $lingow_session_id consistent;

        # Keep the pool fixed while sessions are active. Disabling passive
        # removal prevents a failed node from silently moving a live session.
        server host.docker.internal:8091 max_fails=0;
        server host.docker.internal:8092 max_fails=0;
    }

    server {
        listen 8090;
        server_name _;

        location ~ ^/realtime/v1/sessions/([^/]+)(?:/|$) {
            set $lingow_session_id $1;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream off;

            add_header X-Lingow-Realtime-Upstream $lingow_route_debug always;
            proxy_pass http://realtime_audio;
        }

        location / {
            return 404;
        }
    }
}
